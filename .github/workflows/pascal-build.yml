name: Build Pascal browser app

on:
  push:
    branches:
      - main
    paths:
      - "pcubes_pascal_web/source/**"
      - "pcubes_pascal_web/web/**"
      - "pcubes_pascal_web/webcompat/**"
      - "pcubes_pascal_web/build/**"
      - ".github/workflows/pascal-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Free Pascal tools and Pas2JS
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-utils-3.2.2
          PAS2JS_BIN="$(command -v pas2js-3.2.2)"
          sudo ln -sf "$PAS2JS_BIN" /usr/local/bin/pas2js
          pas2js -iV

      # Use the official GitHub mirror. The GitLab checkout recursively fetched
      # its compiler submodule and failed before the Pascal compile could start.
      - name: Get Pas2JS RTL sources
        env:
          PAS2JS_RTL_COMMIT: 8cd10d88cc81868bce6f03f481b0bc83946d6ace
        run: |
          git clone --depth 1 https://github.com/fpc/pas2js.git /tmp/pas2js-rtl
          test -f /tmp/pas2js-rtl/packages/rtl/system.pas
          mkdir -p /tmp/pas2js-rtl/packages/rtl
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/fpc/FPCSource/$PAS2JS_RTL_COMMIT/utils/pas2js/dist/rtl.js" \
            --output /tmp/pas2js-rtl/packages/rtl/rtl.js
          test -s /tmp/pas2js-rtl/packages/rtl/rtl.js

          # Pas2JS 1.5.1's Char type is not accepted by the RTL's numeric
          # ReadBufferData overload. Read these serialized single-byte chars
          # as UInt8, then convert them back to Pascal characters.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/pas2js-rtl/packages/rtl/classes.pas")
          s = p.read_text()
          for routine in (
              "function TBinaryObjectReader.ReadIdent",
              "function TBinaryObjectReader.ReadStr",
              "function TObjectStreamConverter.ReadStr",
          ):
              start = s.index(routine)
              end = s.find("\nfunction ", start + len(routine))
              if end < 0:
                  end = len(s)
              block = s[start:end]
              block = block.replace("c : Char;", "c : UInt8;")
              block = block.replace("Result[I]:=C;", "Result[I]:=Chr(C);")
              block = block.replace("Result[i]:=C;", "Result[i]:=Chr(C);")
              s = s[:start] + block + s[end:]
          p.write_text(s)
          PY

      - name: Compile Pascal to browser JavaScript
        env:
          PAS2JS_RTL_DIR: /tmp/pas2js-rtl/packages/rtl
          PAS2JS_PACKAGES_DIR: /tmp/pas2js-rtl/packages
        run: |
          chmod +x pcubes_pascal_web/build/build.sh
          ./pcubes_pascal_web/build/build.sh

      - name: Commit generated JavaScript for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pcubes_pascal_web/web/pcubes_web.js pcubes_pascal_web/web/rtl.js
          if git diff --cached --quiet; then
            echo "Generated JavaScript is already up to date."
          else
            git commit -m "Build Pascal browser output"
            git push
          fi
