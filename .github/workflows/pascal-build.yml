name: Build Pascal browser app

on:
  push:
    branches:
      - main
    paths:
      - "pcubes_pascal_web/source/**"
      - "pcubes_pascal_web/web/**"
      - "pcubes_pascal_web/webcompat/**"
      - "pcubes_pascal_web/build/**"
      - ".github/workflows/pascal-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pascal-browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Free Pascal build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-utils-3.2.2 fp-units-fcl-3.2.2 make

      # Use the official GitHub mirror. The GitLab checkout recursively fetched
      # its compiler submodule and failed before the Pascal compile could start.
      - name: Get Pas2JS RTL sources
        env:
          PAS2JS_RTL_COMMIT: 8cd10d88cc81868bce6f03f481b0bc83946d6ace
        run: |
          git clone --depth 1 https://github.com/fpc/pas2js.git /tmp/pas2js-rtl
          git clone --filter=blob:none https://github.com/fpc/FPCSource.git /tmp/pas2js-rtl/compiler
          git -C /tmp/pas2js-rtl/compiler fetch --depth 1 origin "$PAS2JS_RTL_COMMIT"
          git -C /tmp/pas2js-rtl/compiler checkout --detach "$PAS2JS_RTL_COMMIT"
          PAS2JS_BOOTSTRAP="$(command -v pas2js-3.2.2)"
          sudo ln -sf "$PAS2JS_BOOTSTRAP" /usr/local/bin/pas2js
          make -C /tmp/pas2js-rtl all
          sudo ln -sf /tmp/pas2js-rtl/bin/x86_64-linux/pas2js /usr/local/bin/pas2js
          pas2js -iV
          test -f /tmp/pas2js-rtl/packages/rtl/system.pas
          mkdir -p /tmp/pas2js-rtl/packages/rtl
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/fpc/FPCSource/$PAS2JS_RTL_COMMIT/utils/pas2js/dist/rtl.js" \
            --output /tmp/pas2js-rtl/packages/rtl/rtl.js
          test -s /tmp/pas2js-rtl/packages/rtl/rtl.js

          # Pas2JS 1.5.1's Char type is not accepted by the RTL's numeric
          # ReadBufferData overload. Read these serialized single-byte chars
          # as UInt8, then convert them back to Pascal characters.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("/tmp/pas2js-rtl/packages/rtl/classes.pas")
          s = p.read_text()
          s = re.sub(r"(?i)\bc\s*:\s*Char;", "C: UInt8;", s)
          s = re.sub(r"(?i)(Result\s*\[\s*i\s*\]\s*:=\s*)C\s*;", r"\1Chr(C);", s)
          s = re.sub(r"(?i)(Result\s*\[\s*I\s*\]\s*:=\s*)C\s*;", r"\1Chr(C);", s)
          old_decl = "procedure TParser.LoadBuffer;\n\nvar\n  CharsRead,i: integer;"
          new_decl = "procedure TParser.LoadBuffer;\n\nvar\n  CharsRead,i: integer;\n  B: UInt8;"
          if old_decl not in s:
              raise SystemExit("Could not find TParser.LoadBuffer declaration")
          s = s.replace(old_decl, new_decl, 1)
          old_read = "FStream.ReadData(FBuf[i])"
          if old_read not in s:
              raise SystemExit("Could not find TParser.LoadBuffer ReadData call")
          s = s.replace(old_read, "FStream.ReadData(B)", 1)
          old_loop = "      Break;\n    Inc(CharsRead);"
          new_loop = "      Break;\n    FBuf[i] := Chr(B);\n    Inc(CharsRead);"
          if old_loop not in s:
              raise SystemExit("Could not find TParser.LoadBuffer read loop")
          s = s.replace(old_loop, new_loop, 1)
          p.write_text(s)

          PY

      - name: Compile Pascal to browser JavaScript
        env:
          PAS2JS_RTL_DIR: /tmp/pas2js-rtl/packages/rtl
          PAS2JS_PACKAGES_DIR: /tmp/pas2js-rtl/packages
        run: |
          chmod +x pcubes_pascal_web/build/build.sh
          ./pcubes_pascal_web/build/build.sh

      - name: Commit generated JavaScript for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pcubes_pascal_web/web/pcubes_web.js pcubes_pascal_web/web/rtl.js
          if git diff --cached --quiet; then
            echo "Generated JavaScript is already up to date."
          else
            git commit -m "Build Pascal browser output"
            git stash push --include-untracked -m "temporary Pascal build artifacts"
            git pull --rebase origin main
            git stash pop
            git push origin HEAD:main
          fi
